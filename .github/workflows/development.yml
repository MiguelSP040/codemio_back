name: Django Backend CI/CD - Development

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

env:
  PYTHON_VERSION: '3.12'
  MYSQL_VERSION: '8.0'

jobs:
  test:
    name: Tests y Validación
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:${{ env.MYSQL_VERSION }}
        env:
          MYSQL_DATABASE: ${{ secrets.CI_DB_NAME }}
          MYSQL_USER: ${{ secrets.CI_DB_USER }}
          MYSQL_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_ROOT_PASSWORD }}
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run linting
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run migrations
      env:
        DATABASE_URL: mysql://${{ secrets.CI_DB_USER }}:${{ secrets.CI_DB_PASSWORD }}@localhost:3306/${{ secrets.CI_DB_NAME }}
        SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
        DEBUG: ${{ vars.CI_DEBUG || 'True' }}
        ALLOWED_HOSTS: ${{ vars.CI_ALLOWED_HOSTS || 'localhost,127.0.0.1' }}
      run: |
        python manage.py migrate

    - name: Run tests
      env:
        DATABASE_URL: mysql://${{ secrets.CI_DB_USER }}:${{ secrets.CI_DB_PASSWORD }}@localhost:3306/${{ secrets.CI_DB_NAME }}
        SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
        DEBUG: ${{ vars.CI_DEBUG || 'True' }}
        ALLOWED_HOSTS: ${{ vars.CI_ALLOWED_HOSTS || 'localhost,127.0.0.1' }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_COGNITO_REGION: ${{ vars.AWS_COGNITO_REGION }}
        AWS_COGNITO_USER_POOL_ID: ${{ secrets.AWS_COGNITO_USER_POOL_ID }}
        AWS_COGNITO_CLIENT_ID: ${{ secrets.AWS_COGNITO_CLIENT_ID }}
        AWS_COGNITO_CLIENT_SECRET: ${{ secrets.AWS_COGNITO_CLIENT_SECRET }}
      run: |
        python manage.py test

    - name: Generate coverage report
      env:
        DATABASE_URL: mysql://${{ secrets.CI_DB_USER }}:${{ secrets.CI_DB_PASSWORD }}@localhost:3306/${{ secrets.CI_DB_NAME }}
        SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
        DEBUG: ${{ vars.CI_DEBUG || 'True' }}
        ALLOWED_HOSTS: ${{ vars.CI_ALLOWED_HOSTS || 'localhost,127.0.0.1' }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_COGNITO_REGION: ${{ vars.AWS_COGNITO_REGION }}
        AWS_COGNITO_USER_POOL_ID: ${{ secrets.AWS_COGNITO_USER_POOL_ID }}
        AWS_COGNITO_CLIENT_ID: ${{ secrets.AWS_COGNITO_CLIENT_ID }}
        AWS_COGNITO_CLIENT_SECRET: ${{ secrets.AWS_COGNITO_CLIENT_SECRET }}
      run: |
        coverage run --source='.' manage.py test
        coverage xml

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v3
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io

    - name: SonarQube Quality Gate check
      uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
      timeout-minutes: 5
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      continue-on-error: true

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: codemio-backend-dev:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        docker build -t codemio-backend-dev:test .
        echo "Docker image built successfully for development"
        echo "Ready for testing in development environment"
