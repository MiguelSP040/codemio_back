sonar.host.url=https://sonarcloud.io
sonar.projectKey=codemio_backend
sonar.organization=martinjoaquin-dev
sonar.sources=.
sonar.exclusions=**/migrations/**,**/venv/**,**/__pycache__/**,**/tests/**
sonar.tests=.
sonar.test.inclusions=**/tests/**/*.py
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.qualitygate.wait=true
sonar.inclusions=**/*.py,**/*.java