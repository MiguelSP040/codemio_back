version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: codemio_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-codemio_db}
      POSTGRES_USER: ${DB_USER:-codemio_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-codemio_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-codemio_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codemio_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key}
      - DEBUG=${DEBUG:-True}
      - DATABASE_URL=postgresql://${DB_USER:-codemio_user}:${DB_PASSWORD:-codemio_password}@db:5432/${DB_NAME:-codemio_db}
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  postgres_data:
